  - generic [ref=f1e466]: El lienzo es donde está tu diseño. Para ir a la página, presiona la tecla Intro. Para ir a grupos o elementos en la página, vuelve a presionar la tecla Intro. Presiona el tabulador para ir a la siguiente página, al siguiente grupo o al siguiente elemento. Para utilizar la barra de herramientas, usa la tecla “Ctrl+F1”. Si hay un elemento seleccionado, lo puedes mover con las teclas de flechas; lo puedes rotar con la teclas “,” y “.”; y puedes cambiar su tamaño con las teclas de flechas y la tecla “Ctrl”. Aumenta los incrementos de todos estos atajos con la tecla “Mayús.”.
  - generic [ref=f1e467]: El título del diseño contiene su nombre. Para modificarlo, presiona la tecla Intro. Para dejar de editar el título del diseño, presiona la tecla Escape.
